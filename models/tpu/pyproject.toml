[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[project]
name = "resin-models-tpu"
version = "0.1.0"
description = "TPU model plug-ins for Resin, in JAX"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "resin==0.1.0",
  "jax>=0.11",
  "safetensors>=0.5",
]

[tool.uv.sources]
resin = { workspace = true }

[tool.uv.build-backend]
module-root = ""
